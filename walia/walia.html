<section id="contacto-walia" class="walia-section walia-contact">
  <div class="walia-contact-intro">
    <span class="walia-eyebrow walia-center" data-i18n="walia.contactEyebrow"></span>
    <h2 class="walia-center" data-i18n="walia.contactH2"></h2>
    <p class="walia-lead walia-center" data-i18n="walia.contactLead"></p>
  </div>
  <form id="waliaForm" class="walia-form">
    <div class="field">
      <label for="w-nombre" data-i18n="form.nombreLabel"></label>
      <input type="text" id="w-nombre" data-i18n-attr='{"placeholder":"form.nombrePlaceholder"}' placeholder="Tu nombre" required>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="w-email" data-i18n="form.emailLabel"></label>
        <input type="email" id="w-email" placeholder="tu@email.com" required>
      </div>
      <div class="field">
        <label for="w-telefono" data-i18n="form.telefonoLabel"></label>
        <input type="tel" id="w-telefono" placeholder="+34 600 000 000">
      </div>
    </div>
    <div class="field">
      <label for="w-mensaje" data-i18n="walia.mensajeLabel"></label>
      <textarea id="w-mensaje" rows="4" data-i18n-attr='{"placeholder":"walia.mensajePlaceholder"}' placeholder="¿En qué cultivo estás interesado? ¿Cuántas hectáreas?"></textarea>
    </div>
    <button type="submit" class="btn walia-btn-green" data-i18n="walia.submitBtn"></button>
    <p id="waliaSentMsg" class="form-sent-msg" data-i18n="walia.sentMsg" hidden></p>
  </form>
</section>
